[package]
name = "feather-mail"
version = "0.2.0"
edition = "2024"
readme = "README.md"
description = "mail - a fast, elegant desktop mail client built with Rust and GPUI"
license = "MIT"

[[bin]]
name = "mail"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
env_logger = "0.11.11"
gpui = "0.2.2"
html2text = "0.17.4"
raw-window-handle = "0.6"
imap = "2.4.1"
lettre = "0.11.23"
mail-parser = "0.11.9"
minreq = { version = "3.0.0", features = ["https-native-tls"] }
native-tls = "0.2.18"
rusqlite = { version = "0.42.0", features = ["bundled"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
urlencoding = "2.1.3"

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
image = { version = "0.25.10", features = ["png"] }
